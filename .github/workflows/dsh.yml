name: grigdesk-dsh

# Сборка нативных поставок, проверки и публикация Release.
# Живой smoke GLM в CI не выполняется: допуск — вход сборки (compatibility/glm.json),
# полученный локально `grigdesk-dsh-ctl admit --admit` и зафиксированный коммитом.
# Stable-тег требует допуск режима потребителя; кандидат без допуска — только prerelease.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID прогона, чьи артефакты dsh-* опубликовать (release без пересборки)
        required: true
      tag:
        description: Тег релиза (vX.Y.Z или vX.Y.Z-rc.N)
        required: true

permissions:
  contents: write

env:
  # Кэш внутри workspace: actions/cache сохраняет его между прогонами.
  GRIGDESK_DSH_CACHE: ${{ github.workspace }}/.cache

jobs:
  check:
    name: Проверки пакета
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Зависимости
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Кэш pinned Node и снимка upstream
        if: github.ref_type == 'tag'
        uses: actions/cache@v4
        with:
          path: |
            .cache/node-cache
            vendor/deepseek-harness/upstream
          key: dsh-check-${{ runner.os }}-${{ hashFiles('build/node-runtime*.json', 'build/runtime-deps/package-lock.json', 'vendor/deepseek-harness/upstream.lock.json') }}
      - name: Типы и границы импортов
        run: |
          npm run -s typecheck
          node scripts/checkImports.mts
      - name: Подготовка среды тестов
        if: github.ref_type == 'tag'
        run: |
          node scripts/prepareRuntimeDeps.mts --node-cache-dir "$GRIGDESK_DSH_CACHE/node-cache"
          node scripts/prepareUpstream.mts
      - name: Тесты пакета через сторож памяти
        # Тесты собирают ELF-кандидат. На пушах ветки и в PR остаются типы и границы импортов.
        if: github.ref_type == 'tag'
        env:
          GRIGDESK_DSH_TEST_CONCURRENCY: 1
          # Сборка ELF-кандидата одна занимает больше 4 ГБ; бюджет — под runner 16 ГБ.
          NODE_TEST_MAX_RSS_MB: 8192
        run: node scripts/test.mts

  build:
    name: Сборка ${{ matrix.target }}
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15
            target: darwin-arm64
          - os: windows-2025
            target: win32-x64
            extension: .exe
          - os: windows-11-arm
            target: win32-arm64
            extension: .exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      DSH_OUTPUT: deepseek${{ matrix.extension }}
      DSH_ASSET: deepseek-${{ matrix.target }}${{ matrix.extension }}
      # Git for Windows по умолчанию использует CRLF и ограничивает длинные пути.
      GIT_CONFIG_COUNT: 2
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ endsWith(matrix.target, '-arm64') && 'arm64' || 'x64' }}
      - name: Зависимости
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Кэш pinned Node и снимка upstream
        uses: actions/cache@v4
        with:
          path: |
            .cache/node-cache
            vendor/deepseek-harness/upstream
          key: dsh-build-${{ matrix.target }}-${{ hashFiles('build/node-runtime*.json', 'build/runtime-deps/package-lock.json', 'vendor/deepseek-harness/upstream.lock.json') }}
      - name: Среда сборки
        run: |
          node scripts/prepareRuntimeDeps.mts --node-cache-dir .cache/node-cache
          node scripts/prepareUpstream.mts
      - name: Нативные инструменты Apple Silicon
        # Сборщик на darwin читает Mach-O helper process-identity и его SHA только из окружения.
        if: matrix.target == 'darwin-arm64'
        run: |
          xcrun --sdk macosx --show-sdk-path
          node scripts/prepareDarwinTools.mts "$RUNNER_TEMP/dsh-darwin-tools" >> "$GITHUB_ENV"
      - name: Сборка и полная проверка поставки
        env:
          DSH_RELEASE_TAG: ${{ github.ref_name }}
          # diag: сырые причины launcher видны только в журнале сборки
          GRIGDESK_DSH_LAUNCHER_TRACE: "1"
        run: |
          node scripts/buildBinary.mts --out-dir .cache/out --node-cache-dir .cache/node-cache \
            --binary-version "${DSH_RELEASE_TAG#v}"
          node scripts/verify.mts --binary ".cache/out/$DSH_OUTPUT"
      - name: Имя цели и metadata
        # Sidecar пишет сам бинарник на родном runner. Job публикации читает его на Linux.
        run: |
          mv ".cache/out/$DSH_OUTPUT" ".cache/out/$DSH_ASSET"
          ".cache/out/$DSH_ASSET" --runtime-info --json > ".cache/out/$DSH_ASSET.runtime-info.json"
      - name: Допуск GLM (информационно)
        # Код 3 — допуск ещё не получен: нормальный кандидат для prerelease.
        continue-on-error: true
        run: |
          MODE=$(node -p "require('./contracts/grigdesk-host-contract.json').glm.mode")
          node scripts/admissionCheck.mts --binary ".cache/out/$DSH_ASSET" \
            --mode "$MODE" --host-contract contracts/grigdesk-host-contract.json
      - name: Артефакт цели
        uses: actions/upload-artifact@v4
        with:
          name: dsh-${{ matrix.target }}
          path: |
            .cache/out/${{ env.DSH_ASSET }}
            .cache/out/${{ env.DSH_ASSET }}.runtime-info.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  android:
    name: Сборка Android ${{ matrix.abi }}
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    env:
      GRIGDESK_ANDROID_BUILDER: 5921a2e99945ac3bca8c6da55046d9f78f085486
    steps:
      - uses: actions/checkout@v4
      - name: Закреплённый сборщик Bionic из GrigDesk
        uses: actions/checkout@v4
        with:
          repository: EvilDevRu/grigdesk
          ref: ${{ env.GRIGDESK_ANDROID_BUILDER }}
          path: .cache/grigdesk
          persist-credentials: false
          sparse-checkout: |
            tools/android/node-bionic.mts
            tools/android/ndk.lock.json
            shared/node/hash.ts
          sparse-checkout-cone-mode: false
      - name: Версия Node для генерации SEA
        id: node
        run: |
          jq -er '"version=" + (.nodeTag | ltrimstr("v"))' \
            .cache/grigdesk/tools/android/ndk.lock.json >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Зависимости
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Кэш Bionic Node
        uses: actions/cache@v4
        with:
          path: .cache/android-toolchain/out/${{ matrix.abi }}
          key: dsh-bionic-${{ matrix.abi }}-${{ env.GRIGDESK_ANDROID_BUILDER }}-${{ hashFiles('build/android/node-sea.patch') }}
      - name: Подготовить Bionic Node и NDK
        run: |
          bash scripts/prepareAndroidNode.sh "$PWD/.cache/grigdesk" '${{ matrix.abi }}' "$PWD/.cache/android-toolchain"
      - name: Зависимости рабочего поколения Harness
        run: |
          node scripts/prepareRuntimeDeps.mts --node-cache-dir .cache/node-cache
          node scripts/prepareUpstream.mts
      - name: Собрать и проверить комплект Android
        run: |
          node scripts/buildAndroid.mts '${{ matrix.abi }}' .cache/android-toolchain .cache/node-cache \
            "android-dist/${{ matrix.abi }}"
          (cd "android-dist/${{ matrix.abi }}" && sha256sum --check SHA256SUMS)
      - name: Артефакт Android
        uses: actions/upload-artifact@v4
        with:
          name: android-dsh-${{ matrix.abi }}
          path: android-dist/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    # По тегу — после настольной сборки; вручную — из артефактов готового прогона.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success') }}
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Зависимости
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Скачать бинарники всех настольных целей
        uses: actions/download-artifact@v4
        with:
          pattern: dsh-*
          path: ${{ github.workspace }}/.cache/release-download
          merge-multiple: true
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Права Linux x64 после скачивания
        # download-artifact не сохраняет executable bit. Linux x64 нужен для гейта допуска GLM.
        run: |
          chmod 0755 .cache/release-download/deepseek-linux-x64
          ls -la .cache/release-download
      - name: Классифицировать тег
        id: tag
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=" >> "$GITHUB_OUTPUT"
          fi
      - name: Stable требует допуск по фактическому linux-x64 ELF
        # Identity допуска не зависит от платформы, поэтому linux-x64 ELF представляет все цели;
        # CLI дополнительно проверяет допуск и общую identity поколения по metadata всех целей.
        if: steps.tag.outputs.prerelease == ''
        run: |
          MODE=$(node -p "require('./contracts/grigdesk-host-contract.json').glm.mode")
          node scripts/admissionCheck.mts --binary "$GITHUB_WORKSPACE/.cache/release-download/deepseek-linux-x64" \
            --mode "$MODE" --host-contract "$GITHUB_WORKSPACE/contracts/grigdesk-host-contract.json"
      - name: Опубликовать Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          downloads="$GITHUB_WORKSPACE/.cache/release-download"
          windows=()
          # Старые прогоны для ручной публикации могли содержать только Linux и macOS.
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || -f "$downloads/deepseek-win32-x64.exe" \
            || -f "$downloads/deepseek-win32-arm64.exe" ]]; then
            windows=(--binary "$downloads/deepseek-win32-x64.exe" --binary "$downloads/deepseek-win32-arm64.exe")
          fi
          node scripts/cli.mts release --tag "$RELEASE_TAG" \
            --binary "$downloads/deepseek-linux-x64" \
            --binary "$downloads/deepseek-linux-arm64" \
            --binary "$downloads/deepseek-darwin-arm64" \
            "${windows[@]}" \
            --sidecar ${{ steps.tag.outputs.prerelease }}
